name: CI-CD Microservices Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, data-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create a local Kubernetes cluster (kind)
        uses: helm/kind-action@v1.10.0

      - name: Deploy to the cluster
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/auth-service auth-service=${{ secrets.DOCKERHUB_USERNAME }}/auth-service:${{ github.sha }}
          kubectl set image deployment/data-service data-service=${{ secrets.DOCKERHUB_USERNAME }}/data-service:${{ github.sha }}
          kubectl rollout status deployment/auth-service --timeout=90s
          kubectl rollout status deployment/data-service --timeout=90s
          kubectl get pods -o wide